<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>AI Pose Quiz Game - V9.9 Quick Response</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        body { font-family: 'Quicksand', sans-serif; overflow: hidden; background: #0f172a; margin: 0; padding: 0; }
        .camera-flip { transform: scaleX(-1); }
        .correct-bg { background-color: rgba(34, 197, 94, 0.98); }
        .wrong-bg { background-color: rgba(239, 68, 68, 0.98); }
        .answer-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .character-bounce { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const SUPABASE_CONFIG = window.POSE_QUIZ_SUPABASE;
        const supabaseClient = window.supabase.createClient(
            SUPABASE_CONFIG.url,
            SUPABASE_CONFIG.publishableKey,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );

        const API_URL = SUPABASE_CONFIG.url + '/functions/v1/pose-quiz-api';
        const RECOVERY_URL = SUPABASE_CONFIG.url + '/functions/v1/pose-quiz-recovery';

        const recoveryRequest = async (action, payload = {}) => {
            const response = await fetch(RECOVERY_URL, {
                method: 'POST',
                headers: {
                    apikey: SUPABASE_CONFIG.publishableKey,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ action, ...payload })
            });
            let result;
            try { result = await response.json(); }
            catch { throw new Error('Dịch vụ khôi phục trả dữ liệu không hợp lệ.'); }
            if (!response.ok || result?.ok === false) {
                throw new Error(result?.error?.message || `Lỗi khôi phục (${response.status})`);
            }
            return result;
        };

        const mediaSrc = (value) => {
            if (!value) return null;
            if (typeof value === 'string') return value;
            return value.url || value.signedUrl || null;
        };

        const backendRequest = async (action, payload = {}, file = null) => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session?.access_token) throw new Error('Phiên đăng nhập đã hết hạn.');

            const options = {
                method: 'POST',
                headers: {
                    Authorization: `Bearer ${session.access_token}`,
                    apikey: SUPABASE_CONFIG.publishableKey
                }
            };

            if (file) {
                const form = new FormData();
                form.append('file', file);
                options.body = form;
            } else {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify({ action, ...payload });
            }

            const response = await fetch(API_URL + '?action=' + encodeURIComponent(action), options);
            let result;
            try {
                result = await response.json();
            } catch {
                throw new Error('Backend trả về dữ liệu không hợp lệ.');
            }
            if (!response.ok || result?.ok === false) {
                throw new Error(result?.error?.message || `Lỗi backend (${response.status})`);
            }
            return result;
        };

        const DEFAULT_POSE_CONFIG = {
            NONE: { label: 'Bình thường', icon: '🧍' },
            RAISE_LEFT: { label: 'Giơ tay trái', icon: '🙋‍♂️' },
            RAISE_RIGHT: { label: 'Giơ tay phải', icon: '🙋‍♀️' },
            BOTH_UP: { label: 'Giơ hai tay', icon: '🙌' },
            CROSS_ARMS: { label: 'Khoanh tay', icon: '🙅' }
        };

        const analyzePose = (landmarks) => {
            if (!landmarks) return 'NONE';
            const leftWrist = landmarks[15];
            const rightWrist = landmarks[16];
            const leftShoulder = landmarks[11];
            const rightShoulder = landmarks[12];
            
            const isLeftUp = leftWrist.y < leftShoulder.y;
            const isRightUp = rightWrist.y < rightShoulder.y;

            if (isLeftUp && isRightUp) return 'BOTH_UP';
            if (isLeftUp) return 'RAISE_LEFT';
            if (isRightUp) return 'RAISE_RIGHT';

            const wristDistance = Math.sqrt(
                Math.pow(leftWrist.x - rightWrist.x, 2) + 
                Math.pow(leftWrist.y - rightWrist.y, 2)
            );
            if (wristDistance < 0.15) return 'CROSS_ARMS';

            return 'NONE';
        };


        const AuthScreen = () => {
            const [mode, setMode] = useState('login');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [busy, setBusy] = useState(false);
            const [message, setMessage] = useState('');
            const [recoveryChannel, setRecoveryChannel] = useState('email');
            const [smsAvailable, setSmsAvailable] = useState(null);
            const [phone, setPhone] = useState('');
            const [otp, setOtp] = useState('');
            const [recoveryStep, setRecoveryStep] = useState('request');
            const [phoneRecoveryToken, setPhoneRecoveryToken] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');

            useEffect(() => {
                recoveryRequest('capabilities')
                    .then((r) => setSmsAvailable(!!r.sms))
                    .catch(() => setSmsAvailable(false));
            }, []);

            const submit = async (e) => {
                e.preventDefault();
                setBusy(true);
                setMessage('');
                try {
                    if (mode === 'login') {
                        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                    } else {
                        const { data, error } = await supabaseClient.auth.signUp({
                            email,
                            password,
                            options: { emailRedirectTo: window.location.href.split(/[?#]/)[0] }
                        });
                        if (error) throw error;
                        if (!data.session) {
                            setMessage('Đã gửi email xác nhận. Hãy mở email để hoàn tất đăng ký rồi đăng nhập.');
                        }
                    }
                } catch (err) {
                    setMessage(err?.message || 'Không thể xác thực tài khoản.');
                } finally {
                    setBusy(false);
                }
            };

            const beginRecovery = async (e) => {
                e?.preventDefault?.();
                setBusy(true);
                setMessage('');
                try {
                    if (recoveryChannel === 'email') {
                        await recoveryRequest('email.begin', {
                            email,
                            redirect_to: window.location.href.split(/[?#]/)[0]
                        });
                        setMessage('Nếu email đã đăng ký, hệ thống đã gửi liên kết tạo lại mật khẩu. Hãy kiểm tra Hộp thư đến và Thư rác.');
                    } else {
                        const result = await recoveryRequest('phone.begin', { phone });
                        setPhone(result.phone || phone);
                        setRecoveryStep('otp');
                        setMessage('Nếu số điện thoại đã đăng ký, mã OTP đã được gửi.');
                    }
                } catch (err) {
                    setMessage(err.message || 'Không thể gửi yêu cầu khôi phục.');
                } finally {
                    setBusy(false);
                }
            };

            const verifyPhoneOtp = async () => {
                setBusy(true);
                setMessage('');
                try {
                    const result = await recoveryRequest('phone.verify', { phone, token: otp });
                    setPhoneRecoveryToken(result.recovery_token);
                    setRecoveryStep('reset');
                } catch (err) {
                    setMessage(err.message || 'Không xác minh được OTP.');
                } finally {
                    setBusy(false);
                }
            };

            const completePhoneRecovery = async () => {
                if (newPassword.length < 8) return setMessage('Mật khẩu mới cần ít nhất 8 ký tự.');
                if (newPassword !== confirmPassword) return setMessage('Hai mật khẩu mới chưa khớp.');
                setBusy(true);
                setMessage('');
                try {
                    await recoveryRequest('phone.complete', {
                        recovery_token: phoneRecoveryToken,
                        new_password: newPassword
                    });
                    setMode('login');
                    setRecoveryStep('request');
                    setPhoneRecoveryToken('');
                    setOtp('');
                    setNewPassword('');
                    setConfirmPassword('');
                    setMessage('Đã tạo mật khẩu mới. Hãy đăng nhập bằng mật khẩu mới.');
                } catch (err) {
                    setMessage(err.message || 'Không tạo được mật khẩu mới.');
                } finally {
                    setBusy(false);
                }
            };

            const switchMode = (next) => {
                setMode(next);
                setMessage('');
                setRecoveryStep('request');
                setOtp('');
                setPhoneRecoveryToken('');
                setNewPassword('');
                setConfirmPassword('');
            };

            return (
                <div className="w-screen h-screen bg-gradient-to-br from-indigo-700 via-purple-700 to-slate-900 flex items-center justify-center p-4 overflow-y-auto">
                    <div className="w-full max-w-md bg-white rounded-[2rem] shadow-2xl p-8 my-4">
                        <div className="text-center mb-6">
                            <div className="text-6xl mb-3">🙋‍♂️</div>
                            <h1 className="text-3xl font-black text-indigo-700 uppercase tracking-tight">AI Pose Quiz</h1>
                            <p className="text-slate-500 font-semibold mt-1">
                                {mode === 'forgot' ? 'Khôi phục tài khoản an toàn' : 'Đăng nhập để đồng bộ bài dạy và câu hỏi'}
                            </p>
                        </div>

                        {mode !== 'forgot' ? (
                            <>
                                <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl mb-5">
                                    <button type="button" onClick={() => switchMode('login')} className={`py-2 rounded-lg font-black text-sm ${mode === 'login' ? 'bg-white text-indigo-700 shadow' : 'text-slate-500'}`}>ĐĂNG NHẬP</button>
                                    <button type="button" onClick={() => switchMode('register')} className={`py-2 rounded-lg font-black text-sm ${mode === 'register' ? 'bg-white text-indigo-700 shadow' : 'text-slate-500'}`}>ĐĂNG KÝ</button>
                                </div>
                                <form onSubmit={submit} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-black text-slate-500 uppercase">Email</label>
                                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-indigo-400 font-semibold" placeholder="giaovien@truong.edu.vn" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-black text-slate-500 uppercase">Mật khẩu</label>
                                        <input type="password" required minLength="8" value={password} onChange={(e) => setPassword(e.target.value)} className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-indigo-400 font-semibold" placeholder="Tối thiểu 8 ký tự" />
                                    </div>
                                    {message && <div className="text-sm font-bold text-center text-amber-700 bg-amber-50 border border-amber-200 rounded-xl p-3">{message}</div>}
                                    <button disabled={busy} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-60 text-white py-3.5 rounded-xl font-black text-lg shadow-lg">
                                        {busy ? 'ĐANG XỬ LÝ...' : mode === 'login' ? 'ĐĂNG NHẬP' : 'TẠO TÀI KHOẢN'}
                                    </button>
                                </form>
                                {mode === 'login' && (
                                    <button type="button" onClick={() => switchMode('forgot')} className="w-full mt-4 text-indigo-600 font-black text-sm hover:underline">QUÊN MẬT KHẨU?</button>
                                )}
                            </>
                        ) : (
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                                    <button type="button" onClick={() => { setRecoveryChannel('email'); setRecoveryStep('request'); setMessage(''); }} className={`py-2.5 rounded-lg font-black text-sm ${recoveryChannel === 'email' ? 'bg-white text-indigo-700 shadow' : 'text-slate-500'}`}>✉️ EMAIL</button>
                                    <button type="button" disabled={smsAvailable === false} onClick={() => { setRecoveryChannel('phone'); setRecoveryStep('request'); setMessage(''); }} className={`py-2.5 rounded-lg font-black text-sm disabled:opacity-40 ${recoveryChannel === 'phone' ? 'bg-white text-indigo-700 shadow' : 'text-slate-500'}`}>📱 SMS</button>
                                </div>

                                {recoveryChannel === 'email' && (
                                    <form onSubmit={beginRecovery} className="space-y-4">
                                        <div>
                                            <label className="text-xs font-black text-slate-500 uppercase">Email đã đăng ký</label>
                                            <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-indigo-400 font-semibold" placeholder="giaovien@truong.edu.vn" />
                                        </div>
                                        <button disabled={busy} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-black disabled:opacity-60">{busy ? 'ĐANG GỬI...' : 'GỬI LIÊN KẾT KHÔI PHỤC'}</button>
                                    </form>
                                )}

                                {recoveryChannel === 'phone' && recoveryStep === 'request' && (
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-xs font-black text-slate-500 uppercase">Số điện thoại đã đăng ký</label>
                                            <input value={phone} onChange={(e) => setPhone(e.target.value)} className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-indigo-400 font-semibold" placeholder="0912345678 hoặc +84912345678" />
                                        </div>
                                        {smsAvailable === false && <div className="text-xs font-bold text-red-600 bg-red-50 p-3 rounded-xl">Hệ thống hiện chưa cấu hình nhà cung cấp SMS. Kênh email vẫn sử dụng bình thường.</div>}
                                        <button disabled={busy || smsAvailable === false} onClick={beginRecovery} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-black disabled:opacity-40">{busy ? 'ĐANG GỬI...' : 'GỬI MÃ OTP'}</button>
                                    </div>
                                )}

                                {recoveryChannel === 'phone' && recoveryStep === 'otp' && (
                                    <div className="space-y-4">
                                        <div className="text-sm font-bold text-slate-600">Nhập mã OTP gửi tới <b>{phone}</b></div>
                                        <input inputMode="numeric" maxLength="10" value={otp} onChange={(e) => setOtp(e.target.value.replace(/\D/g,''))} className="w-full px-4 py-3 text-center tracking-[0.35em] text-xl rounded-xl border-2 border-slate-200 font-black" placeholder="000000" />
                                        <button disabled={busy || otp.length < 6} onClick={verifyPhoneOtp} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-black disabled:opacity-40">XÁC MINH OTP</button>
                                    </div>
                                )}

                                {recoveryChannel === 'phone' && recoveryStep === 'reset' && (
                                    <div className="space-y-4">
                                        <input type="password" minLength="8" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 font-semibold" placeholder="Mật khẩu mới (ít nhất 8 ký tự)" />
                                        <input type="password" minLength="8" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 font-semibold" placeholder="Nhập lại mật khẩu mới" />
                                        <button disabled={busy} onClick={completePhoneRecovery} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-black disabled:opacity-40">TẠO MẬT KHẨU MỚI</button>
                                    </div>
                                )}

                                {message && <div className="text-sm font-bold text-center text-amber-700 bg-amber-50 border border-amber-200 rounded-xl p-3">{message}</div>}
                                <button type="button" onClick={() => switchMode('login')} className="w-full text-slate-500 font-black text-sm">← QUAY LẠI ĐĂNG NHẬP</button>
                            </div>
                        )}
                        <p className="text-[11px] text-slate-400 text-center mt-5">Mỗi tài khoản chỉ xem và sửa dữ liệu của chính mình.</p>
                    </div>
                </div>
            );
        };

        const EmailRecoveryReset = ({ recoveryState, onDone }) => {
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [busy, setBusy] = useState(false);
            const [message, setMessage] = useState('');

            const submit = async (e) => {
                e.preventDefault();
                if (password.length < 8) return setMessage('Mật khẩu mới cần ít nhất 8 ký tự.');
                if (password !== confirmPassword) return setMessage('Hai mật khẩu chưa khớp.');
                setBusy(true);
                setMessage('');
                try {
                    await recoveryRequest('email.complete', { recovery_state: recoveryState, new_password: password });
                    try { await supabaseClient.auth.signOut({ scope: 'local' }); } catch (_) {}
                    onDone();
                } catch (err) {
                    setMessage(err.message || 'Không tạo được mật khẩu mới.');
                } finally {
                    setBusy(false);
                }
            };

            return (
                <div className="w-screen h-screen bg-gradient-to-br from-emerald-600 via-indigo-700 to-slate-900 grid place-items-center p-4">
                    <form onSubmit={submit} className="w-full max-w-md bg-white rounded-[2rem] shadow-2xl p-8 space-y-4">
                        <div className="text-5xl text-center">🔐</div>
                        <h2 className="text-2xl font-black text-slate-800 text-center">TẠO LẠI MẬT KHẨU</h2>
                        <p className="text-sm text-slate-500 font-semibold text-center">Liên kết khôi phục đã được backend xác thực.</p>
                        <input type="password" required minLength="8" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 font-semibold" placeholder="Mật khẩu mới (ít nhất 8 ký tự)" />
                        <input type="password" required minLength="8" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 font-semibold" placeholder="Nhập lại mật khẩu mới" />
                        {message && <div className="text-sm font-bold text-red-600 bg-red-50 rounded-xl p-3 text-center">{message}</div>}
                        <button disabled={busy} className="w-full bg-emerald-600 text-white py-3.5 rounded-xl font-black disabled:opacity-50">{busy ? 'ĐANG LƯU...' : 'LƯU MẬT KHẨU MỚI'}</button>
                    </form>
                </div>
            );
        };

        const AccountPage = ({ setScreen }) => {
            const [profile, setProfile] = useState(null);
            const [displayName, setDisplayName] = useState('');
            const [schoolName, setSchoolName] = useState('');
            const [phone, setPhone] = useState('');
            const [phoneOtp, setPhoneOtp] = useState('');
            const [phoneStep, setPhoneStep] = useState('idle');
            const [currentPassword, setCurrentPassword] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [busy, setBusy] = useState('');
            const [message, setMessage] = useState('');

            const applyProfile = (p) => {
                setProfile(p);
                setDisplayName(p?.display_name || '');
                setSchoolName(p?.school_name || '');
                setPhone(p?.phone || '');
            };

            const load = async () => {
                setBusy('load');
                try {
                    const result = await backendRequest('account.profile.get');
                    applyProfile(result.profile);
                } catch (err) {
                    setMessage(err.message);
                } finally { setBusy(''); }
            };

            useEffect(() => { load(); }, []);

            const saveProfile = async () => {
                setBusy('profile'); setMessage('');
                try {
                    const result = await backendRequest('account.profile.update', { display_name: displayName, school_name: schoolName });
                    applyProfile(result.profile);
                    setMessage('Đã cập nhật hồ sơ.');
                } catch (err) { setMessage(err.message); }
                finally { setBusy(''); }
            };

            const uploadAvatar = async (file) => {
                if (!file) return;
                setBusy('avatar'); setMessage('');
                try {
                    const result = await backendRequest('account.avatar.upload', {}, file);
                    applyProfile(result.profile);
                    setMessage('Đã cập nhật ảnh đại diện.');
                } catch (err) { setMessage(err.message); }
                finally { setBusy(''); }
            };

            const deleteAvatar = async () => {
                setBusy('avatar'); setMessage('');
                try {
                    const result = await backendRequest('account.avatar.delete');
                    applyProfile(result.profile);
                    setMessage('Đã xóa ảnh đại diện.');
                } catch (err) { setMessage(err.message); }
                finally { setBusy(''); }
            };

            const beginPhone = async () => {
                setBusy('phone'); setMessage('');
                try {
                    const result = await backendRequest('account.phone.begin', { phone });
                    setPhone(result.phone || phone);
                    setPhoneStep('otp');
                    setMessage('Đã gửi OTP đến số điện thoại mới.');
                } catch (err) { setMessage(err.message); }
                finally { setBusy(''); }
            };

            const verifyPhone = async () => {
                setBusy('phone'); setMessage('');
                try {
                    const result = await backendRequest('account.phone.verify', { phone, token: phoneOtp });
                    applyProfile(result.profile);
                    setPhoneStep('idle');
                    setPhoneOtp('');
                    setMessage('Đã xác minh và cập nhật số điện thoại.');
                } catch (err) { setMessage(err.message); }
                finally { setBusy(''); }
            };

            const changePassword = async () => {
                if (newPassword.length < 8) return setMessage('Mật khẩu mới cần ít nhất 8 ký tự.');
                if (newPassword !== confirmPassword) return setMessage('Hai mật khẩu mới chưa khớp.');
                setBusy('password'); setMessage('');
                try {
                    await backendRequest('account.password.change', { current_password: currentPassword, new_password: newPassword });
                    alert('Đổi mật khẩu thành công. Hãy đăng nhập lại bằng mật khẩu mới.');
                    await supabaseClient.auth.signOut({ scope: 'local' });

                            source: shareFilter,
                            search: searchText
                        }),
                        backendRequest('groups.list')
                    ]);

                    setLoading(false);

                setSelected(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const toggleAllVisible = () => {
                const ids = visibleItems.map(item => item.id);

                setSelected(prev => {
                    const next = new Set(prev);
                    ids.forEach(id => allSelected ? next.delete(id) : next.add(id));
                    return next;

        const App = () => {
            const [screen, setScreen] = useState('MENU');
            const [score, setScore] = useState(0);
            const [session, setSession] = useState(null);
            const [authReady, setAuthReady] = useState(false);

            const [backendError, setBackendError] = useState('');
            const [cloudId, setCloudId] = useState(null);
            const [emailRecoveryState, setEmailRecoveryState] = useState(() => new URLSearchParams(window.location.search).get('recovery_state') || '');
            
            const [settings, setSettings] = useState(() => {
                return {
                    subject: "Tin học",
                    title: "Bài dạy AI Pose Quiz",
                    bankVisibility: "private",
                    bankGroupId: "",
                    timeLimit: 20,
                    checkInterval: 3,
                    numAnswers: 4,

                    questions: [
                        {

            useEffect(() => {
                let active = true;
                supabaseClient.auth.getSession().then(({ data }) => {
                    if (!active) return;
                    setSession(data.session || null);
                    setAuthReady(true);
                });
                const { data: listener } = supabaseClient.auth.onAuthStateChange((event, nextSession) => {
                    if (!active) return;
                    setSession(nextSession || null);
                    if (event === 'PASSWORD_RECOVERY') {
                        const state = new URLSearchParams(window.location.search).get('recovery_state') || '';
                        if (state) setEmailRecoveryState(state);
                    }
                    setAuthReady(true);
                });
                return () => {
                    active = false;
                    listener?.subscription?.unsubscribe();
                };
            }, []);

            useEffect(() => {
                if (!session) {
                    setBackendReady(false);
                    setBackendError('');
                    return;
                }
                let cancelled = false;
                setBackendReady(false);
                setBackendError('');
                backendRequest('bootstrap')
                    .then(() => { if (!cancelled) setBackendReady(true); })
                    .catch((err) => { if (!cancelled) setBackendError(err.message || 'Không kết nối được backend.'); });
                return () => { cancelled = true; };
            }, [session?.access_token]);

            const storageUsage = useMemo(() => {
                const paths = new Set();
                const walk = (value) => {
                    if (Array.isArray(value)) return value.forEach(walk);
                    if (!value || typeof value !== 'object') return;
                    if (value.path) paths.add(value.path);
                    Object.values(value).forEach(walk);
                };
                walk(settings);
                return paths.size;
            }, [settings]);

            const saveQuestionsToBank = async (questions) => {
                const subjectName = (settings.subject || 'Chưa phân loại').trim() || 'Chưa phân loại';
                const lessonName = (settings.title || 'Chưa phân loại').trim() || 'Chưa phân loại';
                const visibility = ['private', 'public', 'group'].includes(settings.bankVisibility)
                    ? settings.bankVisibility
                    : 'private';
                const groupId = visibility === 'group' ? (settings.bankGroupId || null) : null;

                if (!questions?.length) return alert('Không có câu hỏi để lưu.');
                if (visibility === 'group' && !groupId) return alert('Hãy chọn nhóm muốn chia sẻ.');

                try {
                    const result = await backendRequest('bank.save', {
                        subject_name: subjectName,
                        lesson_name: lessonName,
                        visibility,
                        group_id: groupId,
                        questions,
                        pose_assets: settings.poseAssets || {}

            const saveToCloud = async () => {
                try {
                    const result = await backendRequest('lessons.save', {
                        id: cloudId,

                        title: (settings.title || 'Bài dạy AI Pose Quiz').trim(),
                        data: settings
                    });
                    setCloudId(result.item.id);
                    setSettings(result.item.data);
                    alert(cloudId ? 'Đã cập nhật bài dạy trên backend.' : 'Đã lưu bài dạy và toàn bộ media lên backend.');
                } catch (err) {
                    alert('Không lưu được bài dạy: ' + err.message);
                }
            };

            const newLesson = () => {
                setCloudId(null);
                setSettings({
                    subject: 'Tin học',
                    title: 'Bài dạy mới',
                    bankVisibility: 'private',
                    bankGroupId: '',
                    timeLimit: 20,
                    checkInterval: 3,
                    numAnswers: 4,
                    poseAssets: { NONE: null, RAISE_LEFT: null, RAISE_RIGHT: null, BOTH_UP: null, CROSS_ARMS: null },
                    questions: [{
                        id: Date.now(),
                        text: 'Nhập nội dung câu hỏi...',
                        image: null,
                        audio: { data: null, name: '' },
                        answers: Array(4).fill(0).map((_, idx) => ({ text: `Đáp án ${idx + 1}`, pose: 'NONE', isCorrect: idx === 0, image: null }))
                    }],
                    audio: {
                        correct: { data: null, name: '' },
                        wrong: { data: null, name: '' },
                        bgm: { data: null, name: '' }
                    }
                });
                setScreen('EDITOR');
            };

            if (!authReady) {
                return <div className="w-screen h-screen grid place-items-center bg-slate-950 text-white font-black text-xl">Đang kết nối Supabase...</div>;
            }

            if (emailRecoveryState) {
                return <EmailRecoveryReset recoveryState={emailRecoveryState} onDone={() => {
                    const clean = window.location.href.split(/[?#]/)[0];
                    window.history.replaceState({}, '', clean);
                    setEmailRecoveryState('');
                    setSession(null);
                }} />;
            }

            if (!session) return <AuthScreen />;

            if (!backendReady) {
                return (
                    <div className="w-screen h-screen bg-slate-950 text-white grid place-items-center p-6 text-center">
                        <div>
                            <div className="text-6xl mb-4">⚙️</div>
                            <div className="text-xl font-black">{backendError ? 'Không kết nối được backend' : 'Đang khởi tạo backend...'}</div>
                            {backendError && <div className="mt-3 text-red-300 font-bold max-w-xl">{backendError}</div>}
                            {backendError && <button onClick={() => window.location.reload()} className="mt-5 bg-indigo-600 px-5 py-2 rounded-xl font-black">THỬ LẠI</button>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-screen h-screen bg-white overflow-hidden select-none">
                    {screen === 'MENU' && <MainMenu setScreen={setScreen} user={session.user} onSignOut={() => supabaseClient.auth.signOut()} />}
                    {screen === 'GAME' && <Game settings={settings} setScreen={setScreen} setScore={setScore} />}
                    {screen === 'EDITOR' && <Editor settings={settings} setSettings={setSettings} setScreen={setScreen} usage={storageUsage} onSaveCloud={saveToCloud} onOpenCloud={() => setScreen('CLOUD')} onOpenBank={() => setScreen('BANK')} onSaveQuestionsToBank={saveQuestionsToBank} onImported={() => setCloudId(null)} cloudId={cloudId} />}
                    {screen === 'CLOUD' && <CloudLibrary setScreen={setScreen} setSettings={setSettings} setCloudId={setCloudId} onNewLesson={newLesson} />}
                    {screen === 'BANK' && <QuestionBank setScreen={setScreen} settings={settings} setSettings={setSettings} user={session.user} />}
                    {screen === 'GROUPS' && <GroupManager setScreen={setScreen} user={session.user} />}
                    {screen === 'ACCOUNT' && <AccountPage setScreen={setScreen} />}
                    {screen === 'RESULT' && <Result score={score} total={settings.questions.length} setScreen={setScreen} />}
                </div>
            );
        };

        const MainMenu = ({ setScreen, user, onSignOut }) => {
            const [profile, setProfile] = useState(null);
            useEffect(() => {
                backendRequest('account.profile.get').then((r) => setProfile(r.profile)).catch(() => {});
            }, []);
            return (
                <div className="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700 text-white p-4 text-center relative">
                    <div className="absolute top-5 right-6 flex items-center gap-3 bg-white/10 border border-white/20 rounded-2xl px-4 py-2 backdrop-blur">
                        <button onClick={() => setScreen('ACCOUNT')} className="flex items-center gap-2 text-left">
                            <div className="w-9 h-9 rounded-full bg-white/20 overflow-hidden grid place-items-center">
                                {profile?.avatar_url ? <img src={profile.avatar_url} className="w-full h-full object-cover" /> : '👤'}
                            </div>
                            <div className="hidden sm:block">
                                <div className="text-xs font-black max-w-48 truncate">{profile?.display_name || user?.email}</div>
                                {profile?.school_name && <div className="text-[9px] text-white/60 max-w-48 truncate">{profile.school_name}</div>}
                            </div>
                        </button>
                        <button onClick={onSignOut} className="text-xs font-black bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-lg">ĐĂNG XUẤT</button>
                    </div>
                    <div className="mb-4 text-8xl animate-bounce drop-shadow-2xl">🙋‍♂️</div>
                    <h1 className="text-6xl font-black mb-2 tracking-tighter uppercase">AI POSE QUIZ</h1>
                    <p className="text-white/80 text-xl mb-7 italic">Học vui cùng trí tuệ nhân tạo - V9.9 Cloud</p>
                    <div className="flex flex-col gap-3 w-[34rem] max-w-full">
                        <button onClick={() => setScreen('GAME')} className="bg-green-500 hover:bg-green-400 py-4 rounded-2xl text-2xl font-black shadow-xl transition-all active:scale-95 uppercase">Bắt đầu</button>
                        <div className="grid grid-cols-2 gap-3">
                            <button onClick={() => setScreen('EDITOR')} className="bg-white/10 hover:bg-white/20 py-3.5 rounded-2xl text-base font-black backdrop-blur-md border border-white/30 transition-all uppercase">✏️ Soạn bài</button>
                            <button onClick={() => setScreen('BANK')} className="bg-violet-500/90 hover:bg-violet-400 py-3.5 rounded-2xl text-base font-black shadow-lg transition-all uppercase">📚 Kho câu hỏi</button>
                            <button onClick={() => setScreen('GROUPS')} className="bg-fuchsia-500/90 hover:bg-fuchsia-400 py-3.5 rounded-2xl text-base font-black shadow-lg transition-all uppercase">👥 Nhóm chia sẻ</button>
                            <button onClick={() => setScreen('CLOUD')} className="bg-sky-500/90 hover:bg-sky-400 py-3.5 rounded-2xl text-base font-black shadow-lg transition-all uppercase">☁️ Bài dạy cloud</button>
                            <button onClick={() => setScreen('ACCOUNT')} className="col-span-2 bg-slate-900/60 hover:bg-slate-900/80 py-3.5 rounded-2xl text-base font-black border border-white/20 transition-all uppercase">👤 Tài khoản của tôi</button>
                        </div>
                    </div>
                </div>
            );
        };

        const Game = ({ settings, setScreen, setScore }) => {
            const [qIndex, setQIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(settings.timeLimit);
            const [checkTimer, setCheckTimer] = useState(settings.checkInterval || 3);
            const [detectedPose, setDetectedPose] = useState('NONE');
            const [feedback, setFeedback] = useState(null);
            const [correctCount, setCorrectCount] = useState(0);
            const [isMuted, setIsMuted] = useState(false);
            const [gameToken, setGameToken] = useState(null);
            const [gameReady, setGameReady] = useState(false);
            const [gameError, setGameError] = useState('');
            const checkInFlightRef = useRef(false);
            
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const poseRef = useRef(null);
            const cameraRef = useRef(null);
            const bgmRef = useRef(null);
            const questionAudioRef = useRef(null);
            const isMounted = useRef(true);

            const currentQuestion = settings.questions[qIndex];

            const getPoseVisual = (poseId) => {
                if (mediaSrc(settings.poseAssets?.[poseId])) {
                    return <img src={mediaSrc(settings.poseAssets[poseId])} className="w-full h-full object-contain" />;
                }
                return <span className="text-4xl">{DEFAULT_POSE_CONFIG[poseId]?.icon || '❓'}</span>;
            };

            useEffect(() => {
                let cancelled = false;
                setGameReady(false);
                setGameError('');
                backendRequest('game.start', { data: settings })
                    .then((result) => {
                        if (cancelled) return;
                        setGameToken(result.game_token);
                        setQIndex(result.index || 0);
                        setCorrectCount(result.score || 0);
                        setGameReady(true);
                    })
                    .catch((err) => {
                        if (!cancelled) setGameError(err.message || 'Không tạo được phiên chơi.');
                    });
                return () => { cancelled = true; };
            }, []);

            const checkAnswer = useCallback(async () => {
                if (feedback || !gameReady || !gameToken || checkInFlightRef.current) return;
                checkInFlightRef.current = true;
                try {
                    const result = await backendRequest('game.check', {
                        game_token: gameToken,
                        detected_pose: detectedPose
                    });

                    const isCorrect = result.feedback === 'correct';
                    setFeedback(result.feedback);
                    setCorrectCount(result.score || 0);

                    if (questionAudioRef.current) {
                        questionAudioRef.current.pause();
                        questionAudioRef.current.currentTime = 0;
                    }
                    const audioSrc = mediaSrc(isCorrect ? settings.audio.correct?.data : settings.audio.wrong?.data);
                    if (audioSrc && !isMuted) new Audio(audioSrc).play().catch(() => {});

                    setTimeout(() => {
                        if (!isMounted.current) return;
                        if (result.finished) {
                            setScore(result.score || 0);
                            setScreen('RESULT');
                        } else {
                            setGameToken(result.game_token);
                            setQIndex(result.next_index);
                            setTimeLeft(settings.timeLimit);
                            setCheckTimer(settings.checkInterval || 3);
                            setFeedback(null);
                            checkInFlightRef.current = false;
                        }
                    }, 1500);
                } catch (err) {
                    checkInFlightRef.current = false;
                    alert('Backend không chấm được câu hỏi: ' + err.message);
                }
            }, [feedback, gameReady, gameToken, detectedPose, isMuted, settings, setScore, setScreen]);

            // Hàm xử lý khi nhấn nút Kiểm tra
            const handleManualCheck = () => {
                if (feedback || !gameReady || checkInFlightRef.current) return;
                setTimeLeft(0);
            };

            useEffect(() => {
                if (bgmRef.current) {
                    bgmRef.current.pause();
                    bgmRef.current = null;
                }
                if (settings.audio.bgm?.data && !isMuted) {
                    bgmRef.current = new Audio(mediaSrc(settings.audio.bgm.data));
                    bgmRef.current.loop = true;
                    bgmRef.current.volume = 0.3;
                    bgmRef.current.play().catch(() => {});
                }
                return () => {
                    if (bgmRef.current) {
                        bgmRef.current.pause();
                        bgmRef.current = null;
                    }
                };
            }, [isMuted, settings.audio.bgm?.data]);

            useEffect(() => {
                if (questionAudioRef.current) {
                    questionAudioRef.current.pause();
                    questionAudioRef.current = null;
                }
                const questionAudio = mediaSrc(currentQuestion?.audio?.data);
                if (questionAudio && !isMuted && !feedback) {
                    questionAudioRef.current = new Audio(questionAudio);
                    questionAudioRef.current.volume = 1;
                    questionAudioRef.current.play().catch(() => {});
                }
                return () => {
                    if (questionAudioRef.current) {
                        questionAudioRef.current.pause();
                        questionAudioRef.current = null;
                    }
                };
            }, [qIndex, currentQuestion?.audio?.data, isMuted]);

            useEffect(() => {
                if (!gameReady) return;
                const videoElement = videoRef.current;
                if (!videoElement) return;

                isMounted.current = true;
                const initPose = async () => {
                    try {
                        poseRef.current = new Pose({ 
                            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` 
                        });
                        poseRef.current.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
                        poseRef.current.onResults((results) => {
                            if (!isMounted.current || !canvasRef.current) return;
                            const canvasCtx = canvasRef.current.getContext('2d');
                            canvasCtx.save();
                            canvasCtx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                            if (results.poseLandmarks) {
                                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#6366f1', lineWidth: 3});
                                drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#f43f5e', lineWidth: 1, radius: 3 });
                                setDetectedPose(analyzePose(results.poseLandmarks));
                            }
                            canvasCtx.restore();
                        });
                        if (!isMounted.current) return;
                        cameraRef.current = new Camera(videoElement, {
                            onFrame: async () => {
                                if (isMounted.current && poseRef.current && videoRef.current) {
                                    await poseRef.current.send({image: videoRef.current});
                                }
                            },
                            width: 640, height: 480
                        });
                        await cameraRef.current.start();

                    } catch (err) {
                        if (isMounted.current) console.warn('Camera/Pose init failed:', err);
                    }
                };

                    isMounted.current = false;

                        cameraRef.current = null;

                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        {q.answers.slice(0, settings.numAnswers).map((ans, idx) => (
                                            <div key={idx} className={`p-4 rounded-3xl border-2 transition-all ${ans.isCorrect ? 'border-green-500 bg-green-50/20 shadow-md ring-4 ring-green-50' : 'border-slate-100 bg-white'}`}>
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-black text-indigo-600 text-[10px]">ĐÁP ÁN {String.fromCharCode(65+idx)}</span>
                                                    <button onClick={() => { const nq = [...settings.questions]; nq[qIdx].answers.forEach((a, i) => a.isCorrect = i === idx); setSettings({...settings, questions: nq}); }} className={`px-3 py-0.5 rounded-full text-[9px] font-black ${ans.isCorrect ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-400'}`}>{ans.isCorrect ? '✓ ĐÚNG' : 'CHỌN LÀM ĐÚNG'}</button>
                                                </div>
                                                <input value={ans.text} onChange={(e) => updateAnswer(idx, {text: e.target.value})} className="w-full bg-transparent border-b border-slate-100 font-bold p-1 mb-2 outline-none text-sm focus:border-indigo-300" placeholder="Nhập mô tả..." />
                                                
                                                <div className="flex gap-3">
                                                    <div className="flex-1 space-y-2">
                                                        <select value={ans.pose} onChange={(e) => updateAnswer(idx, {pose: e.target.value})} className="w-full p-2 bg-slate-50 rounded-xl text-[10px] font-black border-none outline-none appearance-none">
                                                            {Object.keys(DEFAULT_POSE_CONFIG).map(pId => <option key={pId} value={pId}>{DEFAULT_POSE_CONFIG[pId].label}</option>)}
                                                        </select>
                                                        <div className="relative h-8 bg-indigo-50 rounded-xl flex items-center justify-center text-[9px] font-black text-indigo-600 border border-indigo-100 cursor-pointer">
                                                            {ans.image ? '📎 Đổi ảnh' : '📸 Thêm ảnh riêng'}
                                                            <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e) => handleFile(e, (data) => updateAnswer(idx, {image: data}))} />
                                                        </div>
                                                        {ans.image && (
                                                            <button type="button" onClick={() => updateAnswer(idx, {image: null})} className="w-full text-[8px] font-black text-red-500 uppercase">Xóa ảnh đáp án</button>
                                                        )}
                                                    </div>
                                                    <div className="w-16 h-16 bg-white rounded-xl border border-slate-100 flex items-center justify-center overflow-hidden relative shadow-inner">
                                                        {ans.image ? <img src={mediaSrc(ans.image)} className="w-full h-full object-contain" /> : (
                                                            settings.poseAssets[ans.pose] ? <img src={mediaSrc(settings.poseAssets[ans.pose])} className="w-full h-full object-contain" /> : <span className="text-2xl">{DEFAULT_POSE_CONFIG[ans.pose]?.icon}</span>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => { if(settings.questions.length > 1) { const nq = settings.questions.filter((_, i) => i !== qIdx); setSettings({...settings, questions: nq}); setQIdx(0); } }} className="w-full py-3 text-red-500 font-black uppercase text-xs border border-red-100 rounded-xl hover:bg-red-50">Xóa câu hỏi này</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const Result = ({ score, total, setScreen }) => (
            <div className="w-full h-full flex flex-col items-center justify-center bg-white text-center p-6 bg-gradient-to-b from-indigo-50 to-white">
                <div className="text-[10rem] mb-4 animate-bounce drop-shadow-2xl">🏆</div>
                <h2 className="text-6xl font-black text-slate-800 mb-2 uppercase tracking-tighter">XUẤT SẮC!</h2>
                <div className="text-8xl font-black text-indigo-600 mb-10 bg-white px-12 py-4 rounded-[3rem] shadow-xl border-b-8 border-indigo-100">{score}/{total}</div>
                <button onClick={() => setScreen('MENU')} className="bg-indigo-600 text-white px-16 py-5 rounded-[2.5rem] text-3xl font-black shadow-2xl hover:scale-105 transition-all uppercase">Chơi lại thôi!</button>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
